name: Offline Model Lifecycle

on:
  schedule:
    # Runs daily at 01:50 Asia/Saigon (18:50 UTC previous day).
    # retrain_trigger.py no-ops unless schedule, data threshold, or drift conditions are met.
    - cron: "50 18 * * *"
  workflow_dispatch:
    inputs:
      line:
        description: "Insurance line to force retrain, or all lines selected by trigger conditions"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - health
          - motorbike
          - car
          - home
          - accident
          - travel
      dry_run:
        description: "Compute trigger decisions without retraining or persisting candidates"
        required: false
        default: false
        type: boolean
      skip_drift_monitor:
        description: "Skip drift_monitor.py before retrain_trigger.py"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation (keyless GCP auth)

concurrency:
  group: offline-model-lifecycle
  cancel-in-progress: false

jobs:
  drift-and-retrain:
    name: Drift monitor and retrain trigger
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCP_PROJECT_ID: dpp-staging-260703
      GKE_CLUSTER: dpp
      GKE_REGION: asia-southeast1
      NAMESPACE: dpp
      OBJECT_STORAGE_PROVIDER: gcs
      REFERENCE_DATA_URI: gs://dpp-pricing-reference-staging
      PRICING_REFERENCE_DIR: ${{ github.workspace }}/data/synthetic_real_1m_history_lift_v2
      PRICING_TRAIN_DATA_DIR: ${{ github.workspace }}/data/synthetic_real_1m_history_lift_v2
      PRICING_MODELS_DIR: ${{ github.workspace }}/reports/modeling/models
      PRICING_DB_HOST: 127.0.0.1
      PRICING_DB_PORT: "5432"
      PRICING_DB_NAME: pricing_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${{ secrets.PRICING_DB_PASSWORD }}
      PYTHONPATH: ${{ github.workspace }}/pricing:${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set gcloud project
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set billing/quota_project "$GCP_PROJECT_ID"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r pricing/requirements.txt

      - name: Validate pricing database configuration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false || inputs.skip_drift_monitor == false }}
        run: |
          missing=0
          for name in POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret-backed environment variable: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure repository secret: PRICING_DB_PASSWORD."
            exit 1
          fi

      - name: Open pricing database tunnel
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false || inputs.skip_drift_monitor == false }}
        run: |
          set -euo pipefail
          bash deploy/kubeconfig.sh
          export KUBECONFIG="$PWD/.deploy/kubeconfig.yaml"

          kubectl --namespace "$NAMESPACE" rollout status deployment/pricing-service --timeout=180s
          pod="$(kubectl --namespace "$NAMESPACE" get pod -l app=pricing-service -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "$pod" ]; then
            echo "No pricing-service pod found in namespace $NAMESPACE."
            exit 1
          fi

          kubectl --namespace "$NAMESPACE" port-forward "pod/$pod" "$PRICING_DB_PORT:5432" \
            > /tmp/pricing-db-port-forward.log 2>&1 &
          echo "$!" > /tmp/pricing-db-port-forward.pid

          for _ in $(seq 1 30); do
            if python -c 'import os, socket; host = os.environ.get("PRICING_DB_HOST", "127.0.0.1"); port = int(os.environ.get("PRICING_DB_PORT", "5432")); socket.create_connection((host, port), timeout=1).close()'
            then
              echo "Pricing database tunnel is ready on ${PRICING_DB_HOST}:${PRICING_DB_PORT}."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/pricing-db-port-forward.pid)" 2>/dev/null; then
              cat /tmp/pricing-db-port-forward.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/pricing-db-port-forward.log
          exit 1

      - name: Run drift monitor
        if: ${{ github.event_name == 'schedule' || inputs.skip_drift_monitor == false }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python offline/drift_monitor.py --dry-run
          else
            python offline/drift_monitor.py
          fi

      - name: Prepare retrain data and artifacts
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          python -m app.bootstrap_reference_data
          python offline/build_training_dataset_from_pricing_db.py \
            --database-url "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PRICING_DB_HOST}:${PRICING_DB_PORT}/${PRICING_DB_NAME}" \
            --output-dir "$PRICING_TRAIN_DATA_DIR" \
            --created-by "github-actions-offline-lifecycle"

      - name: Run retrain trigger
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=("--dry-run")
          fi
          if [ "${{ inputs.line }}" != "" ] && [ "${{ inputs.line }}" != "all" ]; then
            args+=("--line" "${{ inputs.line }}")
          fi
          python offline/retrain_trigger.py "${args[@]}"

      - name: Upload offline lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-model-lifecycle-${{ github.run_id }}
          path: |
            reports/modeling/models/
            reports/modeling/baselines/
          if-no-files-found: ignore
          retention-days: 14
