name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Java microservices: build, unit/property tests, coverage gate
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-customer:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d customer_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres-product:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: product_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d product_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres-order:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d order_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres-claims:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: claims_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d claims_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres-billing:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billing_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d billing_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres-notification:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notification_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password_dev_only
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d notification_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password_dev_only
      CUSTOMER_DB_HOST: localhost
      CUSTOMER_DB_PORT: 5433
      CUSTOMER_DB_NAME: customer_db
      PRODUCT_DB_HOST: localhost
      PRODUCT_DB_PORT: 5434
      PRODUCT_DB_NAME: product_db
      ORDER_DB_HOST: localhost
      ORDER_DB_PORT: 5435
      ORDER_DB_NAME: order_db
      CLAIMS_DB_HOST: localhost
      CLAIMS_DB_PORT: 5437
      CLAIMS_DB_NAME: claims_db
      BILLING_DB_HOST: localhost
      BILLING_DB_PORT: 5438
      BILLING_DB_NAME: billing_db
      NOTIFICATION_DB_HOST: localhost
      NOTIFICATION_DB_PORT: 5439
      NOTIFICATION_DB_NAME: notification_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run build and tests
        run: ./gradlew clean build
      - name: Verify coverage gate (service subprojects, >=70%)
        run: ./gradlew jacocoTestCoverageVerification
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: services/*/build/reports/jacoco/test/html/

  # Python pricing engine + offline pipeline: tests + coverage
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r pricing/requirements.txt pytest-cov
      - name: Run pricing and common tests with coverage gate (>=70%)
        working-directory: pricing
        run: python -m pytest tests/ common/tests/ --cov=app --cov=common --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -q
      - name: Run offline pipeline tests (monotonic gate + model lifecycle)
        run: python -m pytest offline/tests -q
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: pricing/coverage.xml

  # Docker image build only (no push). CD/deploy to ECR/ECS belongs to Task 22.5.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: customer-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=customer-service
          - image: product-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=product-service
          - image: order-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=order-service
          - image: claims-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=claims-service
          - image: billing-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=billing-service
          - image: notification-service
            context: .
            file: services/Dockerfile
            build-args: |
              SERVICE=notification-service
          - image: pricing-service
            context: .
            file: pricing/Dockerfile
            build-args: ''
          - image: frontend
            context: .
            file: frontend/Dockerfile
            build-args: |
              VITE_API_BASE=http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false
          load: false
          tags: dynamic-pricing/${{ matrix.image }}:${{ github.sha }}
