global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: pricing-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - pricing-service-1:8000

  - job_name: java-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - customer-service-1:8080
          - product-service-1:8080
          - order-service-1:8080
          - claims-service-1:8080
          - billing-service-1:8080
          - notification-service-1:8080

