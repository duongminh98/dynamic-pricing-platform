          FEFCCsD8AW9SXzLSXoFogPKGdXIsh/yW0+8elzPJvzeFoDpVHJDcbvgdrgmRqEiv
          vrn41Op3fZWkIjFDrI8f5mQIEuPMyOAohuTLHAmrN4uIaCfWXIAF6H4dnzlSK42u
          GtgPax86z8z2o7c91zV7BX6Hw0O4gE5ETxyM4pv+wcDOGfsJvCRn/eBYUPEEwIiO
          pwIDAQAB
          -----END PUBLIC KEY-----
      - key: http://keycloak:8080/realms/dynamic-pricing
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyint2Dm+NR4eSQHdGMZP
          0DoX6D1M59a51+YmyGYKmNgcmr64a2lji7hFgxZNFkarT66KfWu+Z7Ly/GN+f0Fz
