services:
  - name: customer-service
    protocol: http
    host: customer-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: customer-routes
        paths:
          - /customers
        strip_path: false
        preserve_host: false

  - name: product-service
    protocol: http
    host: product-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: product-routes
        paths:
          - /products
          - /admin/products
          - /admin/loading-factors
          - /admin/rate-versions
        strip_path: false
        preserve_host: false

  - name: order-service
    protocol: http
    host: order-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: false
    routes:
      - name: order-routes
        paths:
          - /orders
          - /policies
          - /admin/orders
          - /admin/endorsements
        strip_path: false
        preserve_host: false

  - name: claims-service
    protocol: http
    host: claims-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
