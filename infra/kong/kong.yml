services:
  - name: customer-service
    protocol: http
    host: customer-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: customer-routes
        paths:
          - /customers
        strip_path: false
        preserve_host: false

  - name: product-service
    protocol: http
    host: product-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: product-routes
        paths:
          - /products
          - /admin/products
          - /admin/loading-factors
          - /admin/rate-versions
        strip_path: false
        preserve_host: false

  - name: order-service
    protocol: http
    host: order-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
    routes:
      - name: order-routes
        paths:
          - /orders
          - /policies
          - /admin/orders
        strip_path: false
        preserve_host: false

  - name: claims-service
    protocol: http
    host: claims-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
    routes:
      - name: claims-routes
        paths:
          - /claims
        strip_path: false
        preserve_host: false

  - name: billing-service
    protocol: http
    host: billing-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      - name: billing-routes
        paths:
          - /billing
        strip_path: false
        preserve_host: false

  - name: notification-service
    protocol: http
    host: notification-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
    routes:
      - name: notification-routes
        paths:
          - /notifications
        strip_path: false
        preserve_host: false

  - name: pricing-service
    protocol: http
    host: pricing-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
    routes:
      - name: pricing-routes
        paths:
          - /pricing
          - /admin/champion
          - /admin/pricing
        strip_path: false
        preserve_host: false

upstreams:
  - name: customer-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /actuator/health
        timeout: 5
        concurrency: 10
        healthy:
          interval: 5
          successes: 2
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 5
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
          http_statuses:
            - 429
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
    targets:
      - target: host.docker.internal:8081
        weight: 100

