_format_version: "3.0"
_transform: true

plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
  # Browser CORS for the SPA (served at http://localhost:3001, or :5173 in Vite dev).
  # The frontend sends an X-Correlation-Id header on every call, which makes even
  # GETs non-simple and triggers a preflight OPTIONS. This global plugin answers the
  # preflight and adds Access-Control-Allow-* so the browser exposes responses to JS.
  # NOTE: jwt plugins below set run_on_preflight=false so OPTIONS reaches this plugin
  # on protected routes instead of being rejected for a missing token.
  - name: cors
    config:
      origins:
        - http://localhost:3001
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-Id
        - X-Authenticated-User-Sub
        - X-Authenticated-User-Roles
        - X-Authenticated-User-Issuer
        - X-Authenticated-Client-Id
        - X-Authenticated-User-Email
        - X-Authenticated-User-Name-B64
      exposed_headers:
        - X-Correlation-Id
      credentials: true
      max_age: 3600
      preflight_continue: false
  # JWT verification is centralized at Kong. Public bootstrap/catalog routes stay
  # unauthenticated; every protected route below attaches the JWT policy and then
  # injects trusted identity headers for upstream services.

