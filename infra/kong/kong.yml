upstreams:
  - name: customer-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /actuator/health
        timeout: 5
        concurrency: 10
        healthy:
          interval: 5
          successes: 2
          http_statuses:
            - 200
