        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: false
    routes:
      - name: claims-routes
        paths:
          - /claims
        strip_path: false
        preserve_host: false

  - name: billing-service
    protocol: http
    host: billing-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
