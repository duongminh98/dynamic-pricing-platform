services:
  - name: customer-service
    protocol: http
    host: customer-service-upstream
    port: 80
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: customer-public-routes
        paths:
          - /customers/register
          - /customers/login
        strip_path: false
        preserve_host: false
      - name: customer-protected-routes
        paths:
          - /customers/me
          - /customers/me/
          - /admin/customers
        strip_path: false
        preserve_host: false

        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-Authenticated-User-Sub
                  - X-Authenticated-User-Roles
                  - X-Authenticated-User-Issuer
                  - X-Authenticated-Client-Id
                  - X-Authenticated-User-Email
                  - X-Authenticated-User-Name-B64
          - name: post-function
            config:
              access:
                - |
                  local token = kong.ctx.shared.authenticated_jwt_token
                  if token then
                    local payload = token:match("^[^.]+%.([^.]+)%.") or ""
                    payload = payload:gsub("-", "+"):gsub("_", "/")
                    payload = payload .. string.rep("=", (4 - #payload % 4) % 4)
                    local claims_json = ngx.decode_base64(payload) or "{}"
                    local sub = claims_json:match('"sub"%s*:%s*"([^"]*)"') or ""
                    local issuer = claims_json:match('"iss"%s*:%s*"([^"]*)"') or ""
                    local client_id = claims_json:match('"azp"%s*:%s*"([^"]*)"') or claims_json:match('"client_id"%s*:%s*"([^"]*)"') or ""
                    local email = claims_json:match('"email"%s*:%s*"([^"]*)"') or claims_json:match('"preferred_username"%s*:%s*"([^"]*)"') or ""
                    local name = claims_json:match('"name"%s*:%s*"([^"]*)"') or ""
                    local roles_block = claims_json:match('"realm_access"%s*:%s*{%s*"roles"%s*:%s*%[(.-)%]') or ""
                    local roles = {}
                    for role in roles_block:gmatch('"([^"]+)"') do
                      roles[#roles + 1] = role
                    end
                    kong.service.request.set_header("X-Authenticated-User-Sub", sub)
                    kong.service.request.set_header("X-Authenticated-User-Roles", table.concat(roles, ","))
                    kong.service.request.set_header("X-Authenticated-User-Issuer", issuer)
                    kong.service.request.set_header("X-Authenticated-Client-Id", client_id)
                    kong.service.request.set_header("X-Authenticated-User-Email", email)
                    -- Display name may contain UTF-8 (e.g. Vietnamese diacritics); HTTP headers
                    -- are Latin-1, so raw bytes get mangled downstream. Base64 the name instead.
                    kong.service.request.set_header("X-Authenticated-User-Name-B64", ngx.encode_base64(name))
                  end

