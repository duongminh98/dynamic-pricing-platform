          , sub)\n  kong.service.request.set_header(\"X-Authenticated-User-Roles\"\
          , table.concat(roles, \",\"))\n  kong.service.request.set_header(\"X-Authenticated-User-Issuer\"\
          , issuer)\n  kong.service.request.set_header(\"X-Authenticated-Client-Id\"\
          , client_id)\n  kong.service.request.set_header(\"X-Authenticated-User-Email\"\
          , email)\n  -- Display name may contain UTF-8 (e.g. Vietnamese diacritics);\
          \ HTTP headers\n  -- are Latin-1, so raw bytes get mangled downstream. Base64\
          \ the name instead.\n  kong.service.request.set_header(\"X-Authenticated-User-Name-B64\"\
          , ngx.encode_base64(name))\nend\n"
