# Health stub backend used only for the infrastructure checkpoint (task 3).
# Stands in for the real Java/Python services that arrive in later tasks so that
# Kong active health checks pass and gateway routing can be exercised end-to-end.
# Returns 200 on the health probe paths (R19.1) and echoes any other request so a
# JWT-authenticated proxy call through Kong returns a verifiable body.

worker_processes  1;

events {
    worker_connections  256;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;  # Java upstream targets (*-service-N:8080)
        listen 8000;  # FastAPI pricing upstream targets (pricing-service-N:8000)
        server_name _;

        # Java-style probe consumed by Kong upstream active health checks.
        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","component":"health-stub"}';
        }

        # FastAPI-style probe (pricing-service upstream).
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","component":"health-stub"}';
        }

        # Anything else: confirm the request reached the stub through Kong.
        location / {
            default_type application/json;
            return 200 '{"stub":true,"path":"$request_uri","method":"$request_method"}';
        }
    }
}
