server:
  port: 8080

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${BILLING_DB_HOST:localhost}:${BILLING_DB_PORT:5438}/${BILLING_DB_NAME:billing_db}
    username: ${POSTGRES_USER:platform_user}
    password: ${POSTGRES_PASSWORD:platform_password_dev_only}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:platform_user}
    password: ${RABBITMQ_PASSWORD:platform_password_dev_only}
    listener:
      simple:
        auto-startup: false
    dynamic: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/billing

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

vnpay:
  tmn-code: ${VNP_TMN_CODE:}
  hash-secret: ${VNP_HASH_SECRET:}
  pay-url: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNP_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNP_RETURN_URL:http://localhost:3001/payment-result}
  version: ${VNP_VERSION:2.1.0}
  locale: ${VNP_LOCALE:vn}
dpp:
  order:
    base-url: ${ORDER_BASE_URL:http://localhost:8083}
  billing:
    direct-pay:
      enabled: ${BILLING_DIRECT_PAY_ENABLED:false}
