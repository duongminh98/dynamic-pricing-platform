plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dpp'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.5'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('jar') {
        enabled = true
    }
}

// Coverage gate for service subprojects only (not the common library).
// R21.7 / Task 24.2 require at least 70% line coverage and CI must fail below it.
configure(subprojects.findAll { it.name.endsWith('-service') }) {
    def coverageExcludedClassFiles = [
        '**/*Application.class',
        '**/config/**',
        '**/dto/**',
        '**/entity/**'
    ]

    jacocoTestReport {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludedClassFiles)
        }))
    }

    jacocoTestCoverageVerification {
        dependsOn test
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludedClassFiles)
        }))
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    minimum = 0.70
                }
            }
        }
    }
}
