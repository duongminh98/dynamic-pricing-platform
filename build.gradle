plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dpp'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.5'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('jar') {
        enabled = true
    }
}

// Coverage gate for service subprojects only (not the common library).
// Current floor is 0.40 — a realistic threshold for the present (mostly
// mock-based) test suite. TARGET is 0.70 (R21.7 / Task 24.2); raise this as
// Task 20 adds @SpringBootTest + Testcontainers and more property tests.
configure(subprojects.findAll { it.name.endsWith('-service') }) {
    jacocoTestCoverageVerification {
        dependsOn test
        violationRules {
            rule {
                limit {
                    minimum = 0.40
                }
            }
        }
    }
}
