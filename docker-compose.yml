name: ${COMPOSE_PROJECT_NAME:-dynamic-pricing-platform}

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-java-env: &java-env
  POSTGRES_USER: ${POSTGRES_USER:-platform_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-platform_user}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
  KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dynamic-pricing}

x-java-healthcheck: &java-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

services:
  postgres-customer:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-customer
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${CUSTOMER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck

  postgres-product:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-product
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME:-product_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${PRODUCT_DB_PORT:-5434}:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck

  postgres-order:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-order
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${ORDER_DB_PORT:-5435}:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck


  postgres-claims:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-claims
    environment:
      POSTGRES_DB: ${CLAIMS_DB_NAME:-claims_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${CLAIMS_DB_PORT:-5437}:5432"
    volumes:
      - postgres_claims_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck

  postgres-billing:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-billing
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-billing_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${BILLING_DB_PORT:-5438}:5432"
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck

  postgres-notification:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-notification
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck

  postgres-pricing:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: dpp-postgres-pricing
    environment:
      POSTGRES_DB: ${PRICING_DB_NAME:-pricing_db}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_password_dev_only}
    ports:
      - "${PRICING_DB_PORT:-5440}:5432"
    volumes:
      - postgres_pricing_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck: *postgres-healthcheck


  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-05-24T17-08-30Z}
    container_name: dpp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    container_name: dpp-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-platform_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-platform_password_dev_only}
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/enabled_plugins
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.7}
    container_name: dpp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${KEYCLOAK_HEALTH_PORT:-9000}:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  kong:
    image: ${KONG_IMAGE:-kong:3.8.0}
    container_name: dpp-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_LICENSE_DATA: ${KONG_LICENSE_DATA:-}
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
      - "${KONG_STATUS_PORT:-8100}:8100"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: dpp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    container_name: dpp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Checkpoint-only stand-in backend (task 3). Enabled via `--profile checkpoint`.
  # Joins the network under every Kong upstream target hostname so gateway routes
  # resolve to a healthy backend before the real services exist (tasks 4+).
  health-stub:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: dpp-health-stub
    profiles: ["checkpoint"]
    volumes:
      - ./infra/health-stub/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      dpp-network:
        aliases:
          - customer-service-1
          - product-service-1
          - order-service-1
          - claims-service-1
          - billing-service-1
          - notification-service-1
          - pricing-service-1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Application services (one-command bring-up, R16.1)
  # Each Java service runs a single container on dpp-network behind Kong.
  # Flyway migrations run at service startup.


  mailpit:
    image: axllent/mailpit:latest
    container_name: dpp-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - dpp-network
    restart: on-failure

  customer-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: customer-service
    image: dpp/customer-service:latest
    container_name: dpp-customer-service-1
    environment:
      <<: *java-env
      CUSTOMER_DB_HOST: postgres-customer
      CUSTOMER_DB_PORT: 5432
    expose:
      - "8080"
    depends_on:
      postgres-customer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      dpp-network:
        aliases:
          - customer-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  product-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: product-service
    image: dpp/product-service:latest
    container_name: dpp-product-service-1
    environment:
      <<: *java-env
      PRODUCT_DB_HOST: postgres-product
      PRODUCT_DB_PORT: 5432
    expose:
      - "8080"
    depends_on:
      postgres-product:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      dpp-network:
        aliases:
          - product-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  order-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: order-service
    image: dpp/order-service:latest
    container_name: dpp-order-service-1
    environment:
      <<: *java-env
      ORDER_DB_HOST: postgres-order
      ORDER_DB_PORT: 5432
      PRICING_BASE_URL: http://pricing-service-1:8000
      BILLING_BASE_URL: http://billing-service-1:8080
    expose:
      - "8080"
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      dpp-network:
        aliases:
          - order-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  claims-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: claims-service
    image: dpp/claims-service:latest
    container_name: dpp-claims-service-1
    environment:
      <<: *java-env
      CLAIMS_DB_HOST: postgres-claims
      CLAIMS_DB_PORT: 5432
    expose:
      - "8080"
    depends_on:
      postgres-claims:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      dpp-network:
        aliases:
          - claims-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  billing-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: billing-service
    image: dpp/billing-service:latest
    container_name: dpp-billing-service-1
    environment:
      <<: *java-env
      BILLING_DB_HOST: postgres-billing
      BILLING_DB_PORT: 5432
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_PAY_URL: ${VNP_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_API_URL: ${VNP_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:3001/payment-result}
      VNP_VERSION: ${VNP_VERSION:-2.1.0}
      VNP_LOCALE: ${VNP_LOCALE:-vn}
    expose:
      - "8080"
    depends_on:
      postgres-billing:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      dpp-network:
        aliases:
          - billing-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  notification-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification-service
    image: dpp/notification-service:latest
    container_name: dpp-notification-service-1
    environment:
      <<: *java-env
      NOTIFICATION_DB_HOST: postgres-notification
      NOTIFICATION_DB_PORT: 5432
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: noreply@dynamic-pricing.local
      NOTIFICATION_EMAIL_ENABLED: "true"
    expose:
      - "8080"
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      dpp-network:
        aliases:
          - notification-service-1
    healthcheck: *java-healthcheck
    restart: on-failure

  pricing-service-1:
    build:
      context: .
      dockerfile: pricing/Dockerfile
    image: dpp/pricing-service:latest
    container_name: dpp-pricing-service-1
    environment:
      PRICING_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-platform_user}:${POSTGRES_PASSWORD:-change-me}@postgres-pricing:5432/${PRICING_DB_NAME:-pricing_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-platform_user}:${POSTGRES_PASSWORD:-change-me}@postgres-pricing:5432/${PRICING_DB_NAME:-pricing_db}
      PRODUCT_SERVICE_BASE_URL: http://product-service-1:8080
      PRODUCT_CACHE_TTL_SECONDS: ${PRODUCT_CACHE_TTL_SECONDS:-300}
      PRODUCT_HTTP_TIMEOUT_SECONDS: ${PRODUCT_HTTP_TIMEOUT_SECONDS:-3}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-platform_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    expose:
      - "8000"
    volumes:
      - ./reports/modeling/models:/reports/modeling/models:ro
      - ./data/synthetic_real_1m_history_lift_v2:/data/synthetic_real_1m_history_lift_v2:ro
    depends_on:
      postgres-pricing:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      product-service-1:
        condition: service_started
    networks:
      dpp-network:
        aliases:
          - pricing-service-1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://localhost:${KONG_PROXY_PORT:-8000}
    image: dpp/frontend:latest
    container_name: dpp-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      kong:
        condition: service_started
    networks:
      - dpp-network
    restart: on-failure

networks:
  dpp-network:
    name: dynamic-pricing-platform-network
    driver: bridge

volumes:
  postgres_customer_data:
  postgres_product_data:
  postgres_order_data:
  postgres_claims_data:
  postgres_billing_data:
  postgres_notification_data:
  postgres_pricing_data:
  rabbitmq_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
  minio_data:



