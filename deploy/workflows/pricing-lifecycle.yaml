# Cloud Workflows: offline pricing model lifecycle (export ▸ train ▸ validate ▸
# compare ▸ register ▸ drift). Replaces the GitHub Actions cron. Each step runs
# the `lifecycle` image as a Cloud Run Job; artifacts hand off via GCS, metadata
# to pricing_db. Deploy: gcloud workflows deploy pricing-lifecycle --source=this
#
# Args (optional): {"line": "car", "dry_run": false}
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "asia-southeast1"
          - line: ${default(map.get(args, "line"), "all")}
          - run_id: ${text.replace_all(time.format(sys.now()), ":", "-")}
          - models_uri: ${"gs://dpp-pricing-models-staging/" + line + "/" + run_id}
    - export_dataset:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: export-pricing-dataset
    - train_model:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: train-pricing-model
          overrides:
            containerOverrides:
              - args: ["offline/train_pricing_models.py", "--line", "${line}", "--output-uri", "${models_uri}"]
    - validate_model:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: validate-pricing-model
    - compare_candidate:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: compare-candidate
    - register_candidate:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: register-candidate
    - drift_monitor:
        call: runJob
        args:
          project: ${project}
          region: ${region}
          job: drift-monitor
    - done:
        return: ${"lifecycle complete for line=" + line + " run=" + run_id}

# Reusable subworkflow: execute a Cloud Run Job and wait for completion.
runJob:
  params: [project, region, job, overrides: {}]
  steps:
    - execute:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project + "/jobs/" + job}
          location: ${region}
          body: ${overrides}
        result: execution
    - report:
        return: ${execution}
