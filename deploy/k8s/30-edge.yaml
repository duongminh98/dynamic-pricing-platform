apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: dpp-cert
  namespace: dpp
spec:
  domains:
  - api.dpp-pricing.dev
  - app.dpp-pricing.dev
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dpp-ingress
  namespace: dpp
