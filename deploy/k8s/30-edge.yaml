# edge: Kong (public) + frontend SPA + Ingress + ManagedCertificate + NetworkPolicy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: dpp
spec:
  replicas: 1
  selector: {matchLabels: {app: kong}}
  template:
    metadata:
      labels: {app: kong}
    spec:
      containers:
      - name: kong
        image: kong:3.8.0
        env:
        - {name: KONG_DATABASE, value: "off"}
        - {name: KONG_DECLARATIVE_CONFIG, value: /etc/kong/kong.yml}
        - {name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000"}
        - {name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100"}
        - {name: KONG_PLUGINS, value: bundled}
        ports:
        - {containerPort: 8000, name: proxy}
        - {containerPort: 8100, name: status}
        volumeMounts:
        - {name: kong-config, mountPath: /etc/kong/kong.yml, subPath: kong.yml}
        readinessProbe:
          httpGet: {path: /status, port: 8100}
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
      volumes:
      - name: kong-config
        configMap: {name: kong-prod-config}
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: dpp
  annotations:
    cloud.google.com/backend-config: '{"default": "kong-backendconfig"}'
spec:
  type: NodePort
  selector: {app: kong}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: kong-backendconfig
  namespace: dpp
spec:
  healthCheck:
    requestPath: /status
    port: 8100
    type: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dpp
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
      - name: frontend
        image: asia-southeast1-docker.pkg.dev/dpp-staging-260703/dpp/frontend:latest
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /index.html, port: 80}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dpp
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
