# GENERATED by deploy/render_k8s.py — do not edit by hand.
# Keycloak (prod mode, Cloud SQL keycloak_db via proxy sidecar, realm imported once)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: dpp
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      serviceAccountName: keycloak-sa
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.7
        args: ["start", "--optimized", "--import-realm", "--hostname=auth.dpp-pricing.dev", "--proxy-headers=xforwarded", "--http-enabled=true"]
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: "jdbc:postgresql://127.0.0.1:5432/keycloak_db"
        - name: KC_DB_USERNAME
          value: "platform_user"
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: dpp-secrets, key: db-password}
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef: {name: dpp-secrets, key: keycloak-admin}
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: {name: dpp-secrets, key: keycloak-admin-password}
        - name: KC_HEALTH_ENABLED
          value: "true"
        ports:
        - {containerPort: 8080}
        - {containerPort: 9000}
        volumeMounts:
        - {name: realm, mountPath: /opt/keycloak/data/import/realm-export.json, subPath: realm-export.json}
        readinessProbe:
          httpGet: {path: /health/ready, port: 9000}
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests: {cpu: 300m, memory: 640Mi}
          limits: {memory: 1280Mi}
      volumes:
      - name: realm
        configMap: {name: keycloak-realm}
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
        args:
          - "--private-ip"
          - "--structured-logs"
          - "--port=5432"
          - "dpp-staging-260703:asia-southeast1:dpp-pg"
        securityContext:
          runAsNonRoot: true
        resources:
          requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: dpp
spec:
  type: ClusterIP
  selector: {app: keycloak}
  ports: [{port: 8080, targetPort: 8080}]
