# GENERATED by deploy/render_k8s.py — do not edit by hand.
# observability: Prometheus (private) + Grafana (public via ingress)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dpp
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports: [{containerPort: 9090}]
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
        - {name: data, mountPath: /prometheus}
        readinessProbe:
          httpGet: {path: /-/ready, port: 9090}
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
      volumes:
      - name: config
        configMap: {name: prometheus-config}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dpp
spec:
  type: ClusterIP
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dpp
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.3.0
        env:
        - {name: GF_SECURITY_ADMIN_USER, value: "admin"}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: {name: dpp-secrets, key: grafana-admin-password}
        - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
        - {name: GF_SERVER_ROOT_URL, value: "https://grafana.dpp-pricing.dev"}
        ports: [{containerPort: 3000}]
        volumeMounts:
        - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
        - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
        readinessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: datasources
        configMap: {name: grafana-datasources}
      - name: dashboard-provider
        configMap: {name: grafana-dashboard-provider}
      - name: dashboards
        configMap: {name: grafana-dashboards}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-backendconfig
  namespace: dpp
spec:
  healthCheck:
    type: HTTP
    port: 3000
    requestPath: /api/health
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: dpp
  annotations:
    cloud.google.com/backend-config: '{"default": "grafana-backendconfig"}'
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: dpp-grafana-cert
  namespace: dpp
spec:
  domains: [grafana.dpp-pricing.dev]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dpp-grafana-ingress
  namespace: dpp
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "dpp-grafana-cert"
spec:
  rules:
  - host: grafana.dpp-pricing.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: grafana, port: {number: 3000}}}
