[tool.pytest.ini_options]
testpaths = ["common/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[project]
name = "dpp-pricing-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "prometheus_client>=0.21.0",
]

[tool.coverage.run]
omit = ["common/tests/*"]
